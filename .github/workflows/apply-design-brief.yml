name: Apply design brief generator

on:
  push:
    branches:
      - feature/design-brief-generator
    paths:
      - ".github/staging/apply_design_brief.py"
      - ".github/workflows/apply-design-brief.yml"
  pull_request:
    branches:
      - main
    paths:
      - ".github/staging/apply_design_brief.py"
      - ".github/workflows/apply-design-brief.yml"

permissions:
  contents: write

jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/design-brief-generator
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Apply deterministic transformation
        run: python .github/staging/apply_design_brief.py

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Compile and run regression tests
        run: |
          python -m py_compile app.py campaign_store.py content_package.py design_brief.py revision_logic.py senior_review_links.py generation_providers.py
          PYTHONPATH=. pytest -q
          git diff --check

      - name: Commit tested feature and remove staging files
        if: github.event_name == 'push'
        run: |
          rm -f .github/staging/apply_design_brief.py
          rm -f .github/workflows/apply-design-brief.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- app.py campaign_store.py design_brief.py tests/test_design_brief.py tests/test_design_brief_store.py APPROVAL_WORKFLOW.md DEVELOPMENT_ROADMAP.md .github/staging/apply_design_brief.py .github/workflows/apply-design-brief.yml
          git commit -m "Add Senior-approved design brief generator"
          git push origin HEAD:feature/design-brief-generator
