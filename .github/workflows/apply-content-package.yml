name: Apply content package feature

on:
  push:
    branches:
      - feature/content-package-caption-reel-script
    paths:
      - ".github/staging/apply_content_package.py"
      - ".github/workflows/apply-content-package.yml"

permissions:
  contents: write

jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/content-package-caption-reel-script
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Apply deterministic transformation
        run: python .github/staging/apply_content_package.py

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Compile and run regression tests
        run: |
          python -m py_compile app.py campaign_store.py content_package.py revision_logic.py senior_review_links.py generation_providers.py
          PYTHONPATH=. pytest -q tests/test_content_package.py tests/test_revision_logic.py tests/test_senior_review_links.py tests/test_campaign_store.py tests/test_generation_providers.py
          git diff --check

      - name: Commit tested feature and remove staging files
        run: |
          rm -f .github/staging/apply_content_package.py
          rm -f .github/workflows/apply-content-package.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- app.py campaign_store.py generation_providers.py n8n_workflows/calendar_generate_v1.json tests/test_generation_providers.py .github/staging/apply_content_package.py .github/workflows/apply-content-package.yml
          git commit -m "Add captions and reel scripts to content package"
          git push origin HEAD:feature/content-package-caption-reel-script
